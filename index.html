<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Scholarly Publisher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                50: '#f5f0fa',
                100: '#ebe4f5',
                200: '#d4c6ea',
                300: '#b69fdc',
                400: '#9678cb',
                500: '#7854b8',
                600: '#5f259f', /* Kriyadocs Primary */
                700: '#511e8a',
                800: '#451a74',
                900: '#2d104c',
              },
              orcid: '#A6CE39',
            },
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
            },
            animation: {
              'fade-in-up': 'fadeInUp 0.6s ease-out forwards',
              'fade-in': 'fadeIn 0.8s ease-out forwards',
              'blob': 'blob 7s infinite',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(20px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              }
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      /* 
         Modern CSS Enhancements 
         These act as Critical CSS to ensure layout stability before Tailwind loads
      */

      :root {
        /* Enable smooth scrolling for anchor links */
        scroll-behavior: smooth;
        /* Prevent layout shift when scrollbar appears */
        scrollbar-gutter: stable;
      }

      /* Explicit Reset */
      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Modern Typography Enhancements */
      h1, h2, h3, h4, h5, h6 {
        /* Balances text across lines for headings (avoids uneven lengths) */
        text-wrap: balance; 
      }
      
      p {
        /* Prevents orphans (single words on the last line) */
        text-wrap: pretty;
      }

      /* Custom Scrollbar for a polished feel */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: #d4c6ea;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #b69fdc; 
      }

      /* Improve Focus Visibility for Accessibility */
      :focus-visible {
        outline: 2px solid #5f259f;
        outline-offset: 2px;
      }

      /* Fix for Chrome Autofill Background Color override */
      input:-webkit-autofill,
      input:-webkit-autofill:hover, 
      input:-webkit-autofill:focus, 
      input:-webkit-autofill:active {
        -webkit-text-fill-color: #111827;
        transition: background-color 5000s ease-in-out 0s;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0"
  }
}
</script>
</head>
  <body class="bg-white antialiased text-slate-800">
    <div id="root"></div>
  </body>
</html>
